name: Docs

# Consolidated from two workflows that both fired on every push to main:
# the previous `docs.yml` pushed to a gh-pages branch via a third-party action,
# while `static.yml` published through GitHub Pages' own deployment. Pages is
# sourced from Actions — `actions/deploy-pages` has been succeeding — so the
# Pages mechanism is the one that actually serves the site, and the gh-pages
# branch was being rebuilt on every commit without being read. The stale
# gh-pages branch can now be deleted.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      # TODO(PR 13): add -W to turn Sphinx warnings into errors. Blocked until
      # docs/api.rst stops referencing modules by unqualified name, which
      # currently leaves all but two modules undocumented.
      - name: Build documentation
        run: sphinx-build -b html docs docs/_build/html

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_build/html

  deploy:
    name: Deploy
    # Pull requests build the docs but must not publish them.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
