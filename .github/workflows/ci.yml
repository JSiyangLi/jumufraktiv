name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install "ruff>=0.6"

      # The library carries an itemised lint-debt baseline in pyproject.toml;
      # `tests/` carries no exemptions and must stay clean.
      - name: Lint
        run: ruff check .

      # The whole tree, as of PR 14d. `ruff format` was held back through the
      # audit so a reformat could not bury the diffs of the changes being
      # reviewed; there is nothing left to bury.
      - name: Check formatting
        run: ruff format --check .

  # Every test runs on every push, but the expensive ones run once rather than
  # four times. The `slow` marker covers tests dominated by quadrature: they
  # are not less important -- several are the most valuable in the suite -- so
  # they must run somewhere on every push, and this job is that somewhere.
  # Splitting the matrix this way took CI from about 45 minutes of compute per
  # push to about 15, with no test excluded anywhere.
  test:
    name: Test (Python ${{ matrix.python-version }}${{ matrix.slow && ', full' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.13']
        slow: [false]
        include:
          # One version carries the whole suite, including the slow tests and
          # the coverage measurement. 3.12 is chosen because it is the version
          # the lint job already uses.
          - python-version: '3.12'
            slow: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The docstring examples are executed here too, not merely rendered: they
      # printed invented numbers for several releases -- `1.234567e+00` among
      # them -- because nothing ran them. There is no separate step for them,
      # because `tests/test_documentation_runs.py` runs the `--doctest-modules`
      # command in a subprocess and is `slow`-marked, so this job collects it.
      # A dedicated step would run the same 28 seconds a second time.
      - name: Run the full suite
        if: matrix.slow
        run: pytest -v --cov=jumufraktiv --cov-report=term-missing

      - name: Run the quick pass
        if: ${{ !matrix.slow }}
        run: pytest -v -m "not slow"

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: pip install build twine

      # Guards the packaging metadata fixed in PR 1: a wheel and sdist must
      # build, and the README must render on PyPI.
      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      # The docs build succeeded with 79 warnings while the API reference
      # documented 2 of the package's 36 modules, so "it builds" was never the
      # property worth checking. A counted baseline replaced that, and `-W` now
      # replaces the baseline: any warning fails the build. A count is a
      # ratchet that permits swapping one defect for another, which is the
      # thing a reference manual most needs not to allow.
      #
      # `-E` discards the saved environment so every page is re-read. Sphinx
      # skips unchanged documents otherwise, and a warning is emitted during
      # the read it is skipping -- so an incremental build can report clean for
      # a page that is not.
      - name: Build the documentation
        run: |
          pip install -e ".[docs]"
          python -m sphinx -W -E -b html docs /tmp/docbuild

      - name: Verify a clean install imports
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/python -c "import jumufraktiv; print(jumufraktiv.__version__)"

      # `twine check` renders the README; it does not run it. The quick start
      # raised TypeError on the installed package while this job was green,
      # because nothing executed the one example a new user meets first.
      #
      # The examples run in a subprocess from an empty temporary directory, so
      # they import the wheel installed above rather than the source tree this
      # job is checked out into. `not slow` drops the one test that re-runs the
      # docstring examples; those belong to the test job.
      - name: Run the README quick start against the installed wheel
        run: |
          /tmp/fresh/bin/pip install pytest docutils
          /tmp/fresh/bin/python -m pytest tests/test_documentation_runs.py -q -m "not slow"
