name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install "ruff>=0.6"

      # The library carries an itemised lint-debt baseline in pyproject.toml;
      # `tests/` carries no exemptions and must stay clean.
      - name: Lint
        run: ruff check .

      - name: Check formatting of tests
        run: ruff format --check tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v --cov=jumufraktiv --cov-report=term-missing

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: pip install build twine

      # Guards the packaging metadata fixed in PR 1: a wheel and sdist must
      # build, and the README must render on PyPI.
      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Verify a clean install imports
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/python -c "import jumufraktiv; print(jumufraktiv.__version__)"
