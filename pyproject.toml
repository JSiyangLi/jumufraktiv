[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jumufraktiv"
description = "Bayesian inference via fractional derivatives of prior moment-generating functions."
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Si-Yang Li" },
    { name = "Josh Speagle" },
]
maintainers = [
    { name = "Si-Yang Li" },
    { name = "Josh Speagle" },
]
keywords = [
    "bayesian-inference",
    "moment-generating-function",
    "fractional-derivative",
    "marginal-likelihood",
    "evidence",
    "posterior",
    "statistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# ---------------------------------------------------------------------------
# Runtime dependencies.
#
# Every package below is imported at *import time* by shipped library code, so
# each one is a hard requirement today. `pandas` is imported by all 14
# `like_stats` modules, `mpmath` by the high-precision fractional backend, and
# `jax` by `mitMGFprior_class` and `root_finding`.
#
# Making `jax` and `pandas` optional (lazy import + graceful degradation) is
# tracked for a later wave of the audit; see CLAUDE.md.
# ---------------------------------------------------------------------------
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "pandas>=2.0",
    "mpmath>=1.3",
    "jax>=0.4.20",
]
dynamic = ["version"]

[project.optional-dependencies]
# PyTorch backend for the Pareto prior's MGF. Optional: the package must import
# and register every prior without it.
torch = ["torch>=2.0"]

# Running the example notebooks.
examples = [
    "matplotlib>=3.7",
    "jupyter>=1.0",
]

# Building the Sphinx documentation.
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

# Test suite and linting. Kept in sync with the CI workflow.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/JSiyangLi/jumufraktiv"
Documentation = "https://jsiyangli.github.io/jumufraktiv/"
Repository = "https://github.com/JSiyangLi/jumufraktiv"
Issues = "https://github.com/JSiyangLi/jumufraktiv/issues"
Changelog = "https://github.com/JSiyangLi/jumufraktiv/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Packaging
# ---------------------------------------------------------------------------
[tool.setuptools.dynamic]
version = { attr = "jumufraktiv._version.__version__" }

[tool.setuptools.packages.find]
include = ["jumufraktiv*"]
exclude = ["jumufraktiv.tests*", "tests*", "docs*"]
