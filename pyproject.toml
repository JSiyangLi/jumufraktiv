[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jumufraktiv"
description = "Bayesian inference via fractional derivatives of prior moment-generating functions."
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Si-Yang Li" },
    { name = "Josh Speagle" },
]
maintainers = [
    { name = "Si-Yang Li" },
    { name = "Josh Speagle" },
]
keywords = [
    "bayesian-inference",
    "moment-generating-function",
    "fractional-derivative",
    "marginal-likelihood",
    "evidence",
    "posterior",
    "statistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# ---------------------------------------------------------------------------
# Runtime dependencies.
#
# Every package below is imported at *import time* by shipped library code, so
# each one is a hard requirement today. `pandas` is imported by all 14
# `like_stats` modules, `mpmath` by the high-precision fractional backend, and
# `jax` by `MGFPrior_class` and `root_finding`.
#
# Making `jax` and `pandas` optional (lazy import + graceful degradation) is
# tracked for a later wave of the audit; see CLAUDE.md.
# ---------------------------------------------------------------------------
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "pandas>=2.0",
    "mpmath>=1.3",
    "jax>=0.4.20",
]
dynamic = ["version"]

[project.optional-dependencies]

# Running the example notebooks.
examples = [
    "matplotlib>=3.7",
    "jupyter>=1.0",
]

# Building the Sphinx documentation.
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

# Test suite and linting. Kept in sync with the CI workflow.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    # tests/test_documentation_runs.py renders README.rst the way PyPI does.
    "docutils>=0.20",
    # tests/test_packaging.py builds both distributions and validates the
    # citation file against the CFF schema.
    "build>=1.0",
    "cffconvert>=2.0",
]

[project.urls]
Homepage = "https://github.com/JSiyangLi/jumufraktiv"
Documentation = "https://jsiyangli.github.io/jumufraktiv/"
Repository = "https://github.com/JSiyangLi/jumufraktiv"
Issues = "https://github.com/JSiyangLi/jumufraktiv/issues"
Changelog = "https://github.com/JSiyangLi/jumufraktiv/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Packaging
# ---------------------------------------------------------------------------
[tool.setuptools.dynamic]
version = { attr = "jumufraktiv._version.__version__" }

[tool.setuptools.packages.find]
include = ["jumufraktiv*"]
exclude = ["jumufraktiv.tests*", "tests*", "docs*"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/` is not a package, so conftest.py's helpers are imported by module
# name; prepend keeps that working without an __init__.py.
pythonpath = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    # A test earns this marker by costing more than about three seconds, which
    # in this package always means real quadrature rather than anything
    # avoidable. `pytest -m "not slow"` is the iteration loop; CI runs the full
    # suite on one Python version and the quick pass on the rest, so no test is
    # skipped everywhere.
    #
    # TARGET, NOT YET MET: the quick pass should be under a minute. Measured
    # figures move as the suite grows, so treat them as of a stated commit
    # rather than as standing facts -- at f51c7d2, 162 s for the quick pass
    # against 278 s for the full suite, on an idle box.
    #
    # The largest avoidable cost is gone: SymPy was recomputing the same
    # derivative 97,308 times per quick pass for 40 distinct (expression,
    # symbol, order) triples, which jumufraktiv/symbolic_cache.py now memoises.
    # That took the quick pass from 310 s to 162 s and the full suite from 508 s
    # to 278 s, both measured against an unmodified tree in a separate worktree.
    #
    # What remains is real quadrature, so closing the rest of the gap needs the
    # fixed-grid kernel of PR 6 rather than more `slow` markers. Marking more
    # would only move the cost, and past some point it hollows the quick pass
    # out until it stops catching anything.
    #
    # Marking is a scheduling decision, never a statement about importance:
    # several of the slowest tests here are the most valuable in the suite.
    "slow: takes seconds of quadrature; excluded from the quick pass",
]
filterwarnings = [
    "error",
    # The package warns on legitimately slow paths; those are not test failures.
    "ignore:computing high-order posterior moments can be very slow:RuntimeWarning",
    "ignore:Symbolic fractional derivatives can be very slow.*:UserWarning",
]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
# The example notebooks are illustrative prose-with-code, not shipped library
# code. Linting them mostly flags mathematical notation in comments, and
# reformatting them would churn stored output cells for no benefit.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

# Greek letters carry the mathematics in this package's docstrings, matching the
# notation of the reference paper. Ruff flags them because they resemble Latin
# letters -- alpha for a, rho for p, sigma for o, gamma for y -- which is the
# right default for prose and the wrong one here.
#
# Listing them is what let RUF001-003 come out of the per-file ignores. Blanket
# suppression could not tell these apart from the non-breaking hyphen that was
# standing in for `-` in 336 places, 41 of them inside error messages, where it
# defeats a grep for the message text.
allowed-confusables = ["α", "ρ", "σ", "γ", "−"]

[tool.ruff.lint.per-file-ignores]
# ---------------------------------------------------------------------------
# Lint debt baseline for the pre-audit library code.
#
# This is an itemised, shrinking list, not a blanket suppression: every code
# below is owned by a scheduled PR, and that PR deletes its entries. New code
# is held to the full rule set, and `tests/` carries no exemptions at all.
#
# PR 8 removed thirteen codes -- E402, E713, E731, F401, F541, I001, B028,
# B904 and the five SIM codes -- along with RUF059 and W292, which its
# deletions happened to clear. All three per-file exemptions went too, one of
# them for a module that no longer exists.
#
# PR 9 removed B007, B905 and RUF046. The last of those is worth a note: one
# of its two sites was a FALSE positive. `int(round(order))` looks redundant
# and is not, because `round()` returns a `sympy.Integer` for a SymPy order
# while `mgfDerivative_integer` needs a Python `int` -- dropping the cast
# would have undone the repair PR 5 made for `sp.Integer(2)`. That line
# carries a `noqa` with the reason; the genuinely redundant one is gone.
#
# PR 12 removed the four annotation codes -- UP006, UP007, UP035 and UP045 --
# in 122 places across the library. All four are the same modernisation:
# `Dict[str, float]` becomes `dict[str, float]`, `Union[int, str]` becomes
# `int | str`, `Optional[float]` becomes `float | None`, and the `typing`
# imports that existed only to spell those go with them. The whole rule group
# `UP` is now clean, so nothing in this baseline exempts it any more.
#
# The choice is not stylistic here: `requires-python` is `>=3.10`, where the
# PEP 585 and PEP 604 spellings are the language's own and the `typing`
# aliases are deprecated. Keeping both spellings in one package meant the
# public signatures read differently depending on which module a reader
# opened.
#
# F821 (undefined-name) and F811 (redefined-while-unused) were never exempted
# package-wide, because they find defects rather than style. As of PR 8 they
# have no per-file exemptions either, so both block everywhere.
# ---------------------------------------------------------------------------
#
# PR 12 also removed F841, RUF001, RUF002, RUF003, W291 and W293.
#
# F841's one remaining site was `pareto_logimgf`'s discarded `sign`, and the
# discarded sign was the least of what was wrong with that function: it
# returned NaN at every argument. Repairing the function cleared the rule,
# which is the order these two belong in -- the lint was the symptom.
#
# The three RUF00x codes had been filed as cosmetic, and were not. They were
# suppressed wholesale because nobody had separated a look-alike from
# legitimate notation. Of 520 flagged characters, 336 were U+2011 NON-BREAKING
# HYPHEN standing in for `-`, and 41 of those sat inside error messages, where
# it silently defeats a grep or a copy-paste search for the message text; the
# rest are Greek letters carrying the mathematics, which `allowed-confusables`
# above now permits by name. Blanket suppression could not tell the two apart,
# which is why it hid the first group for the whole audit.
#
# E501 went too, and the reason it had survived is worth recording because it
# was wrong twice. The entry said that fixing it meant running `ruff format`
# over the library, and that this would bury the real diffs of whatever PR
# carried it. The second half is true and is why the formatter is still its own
# scheduled change. The first half is not: the 99 over-length lines were
# rewrapped directly, in a diff that touches only those lines. And `ruff
# format` would not have fixed them anyway -- it leaves 40 of the 99, because
# it does not reflow strings, docstrings or comments, which is where 68 of them
# lived.
#
# THE LIST IS NOW EMPTY, and that is the point: the library is held to the same
# rules as `tests/`. An entry added here from now on is a new exemption, not an
# inherited one, and should be argued for rather than assumed.
# ---------------------------------------------------------------------------
"jumufraktiv/**" = []
